name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Require develop as the production promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "Pull requests to main must come from develop."
            exit 1
          fi

  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Build and test
        run: npm run check

      - name: Build separated Sites artifacts
        env:
          VITE_XGUARD_API_BASE_URL: https://api.staging.example.com
          VITE_SUPABASE_URL: https://project.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_contract_value
          VITE_ADMIN_REDIRECT_URL: https://admin.staging.example.com/auth/callback
        run: |
          npm run build:sites:customer
          npm run build:sites:admin

  backend-container:
    name: Backend container smoke
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build and smoke-test backend container
        run: npm run check:backend-container
